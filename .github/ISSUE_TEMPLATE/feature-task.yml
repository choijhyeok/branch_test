name: Feature / Task
description: 새로운 기능 or 작업 이슈를 생성합니다.
title: "[Feature] "
labels:
  - feature
body:
  - type: input
    id: summary
    attributes:
      label: 요약
      description: 이 이슈에 대한 한 줄 요약을 적어주세요.
      placeholder: 예) 보험 청약 화면 STT 기능 추가
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 / 목적
      description: 왜 이 작업이 필요한지, 배경과 목적을 적어주세요.
      placeholder: |
        - 기존 문제점
        - 개선하려는 부분
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 상세 요구사항
      description: 구현해야 할 상세 기능과 요구사항을 적어주세요.
      placeholder: |
        - [ ] 항목 1
        - [ ] 항목 2
        - [ ] 항목 3
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: 기타 참고 사항
      description: 관련 문서, 화면 설계, API 명세 등의 링크가 있다면 적어주세요.
      placeholder: |
        - Figma:
        - Notion:
        - API Spec:
    validations:
      required: false