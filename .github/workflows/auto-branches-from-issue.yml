name: Create branches from issue

on:
  issues:
    types: [opened]

permissions:
  # issues: write 권한은 GH CLI를 사용하여 이슈에 브랜치를 연결하는 데 필요합니다.
  contents: write
  issues: write

jobs:
  create_branches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        # 원격 브랜치 목록을 가져와야 하므로 checkout은 유지합니다.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev # 베이스 브랜치

      - name: Install Git LFS (for better git ls-remote performance)
        # git ls-remote가 더 안정적으로 작동하도록 합니다. (선택 사항)
        run: |
          sudo apt-get install git-lfs -y

      - name: Create branch from issue title and link (Sequentially)
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: dev
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          echo "Issue title: $ISSUE_TITLE"
          echo "Issue number: $ISSUE_NUMBER"

          # 1. 태그 제거 및 슬러그 생성 (이슈 제목에 따라 고유 슬러그 생성)
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/^\[[^]]*\][[:space:]]*//')
          CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          SLUG=$(echo "$CLEAN_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[[:punct:]]//g' \
            | tr ' ' '-' \
          )
          SLUG=$(echo "$SLUG" \
            | sed 's/-\+/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
          )
          
          if [ -z "$SLUG" ]; then
            echo "Slug is empty. Aborting."
            exit 1
          fi
          
          echo "Generated Slug: $SLUG"

          # 2. 다음 순번(Index) 결정
          
          # 원격 저장소의 모든 브랜치를 가져옵니다.
          EXISTING_BRANCHES=$(git ls-remote --heads origin | awk '{print $2}' | sed 's/refs\/heads\///')
          
          MAX_INDEX=-1
          
          # 브랜치 목록을 순회하며 'XX-slug-issue' 패턴에서 가장 큰 XX를 찾습니다.
          for BRANCH in $EXISTING_BRANCHES; do
              # 브랜치 이름이 '숫자-문자열-issue' 패턴과 일치하는 경우만 필터링합니다.
              # 예: 00-test-issue, 15-feature-issue
              if echo "$BRANCH" | grep -E -q '^[0-9]{2,3}-.*-issue$'; then
                  # 앞의 숫자(인덱스)를 추출합니다.
                  CURRENT_INDEX=$(echo "$BRANCH" | cut -d'-' -f1)
                  # 추출된 인덱스를 정수로 변환하여 비교합니다.
                  NUM_INDEX=$(printf "%d" "$CURRENT_INDEX")
                  
                  if [ "$NUM_INDEX" -gt "$MAX_INDEX" ]; then
                      MAX_INDEX="$NUM_INDEX"
                  fi
              fi
          done

          # 다음으로 사용할 인덱스
          NEXT_INDEX=$((MAX_INDEX + 1))
          
          # 인덱스 범위 확인 (00부터 20까지 21개)
          if [ "$NEXT_INDEX" -gt 20 ]; then
             echo "Maximum index (20) reached. No branch created."
             exit 1
          fi

          # 3. 브랜치 이름 생성 및 연결
          
          # 다음 인덱스를 '00' 형식으로 포맷합니다.
          FORMATTED_INDEX=$(printf "%02d" $NEXT_INDEX)
          BRANCH_NAME="${FORMATTED_INDEX}-${SLUG}-issue"

          REPO="${{ github.repository }}"
          
          echo "Next Index to use: $FORMATTED_INDEX"
          echo "Creating & linking branch: $BRANCH_NAME"

          # 브랜치 생성 및 이슈 연결 (GH CLI 사용)
          # gh issue develop은 브랜치가 없으면 BASE_BRANCH를 기준으로 생성하고 연결까지 해줍니다.
          gh issue develop "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --branch-repo "$REPO" \
            --base "$BASE_BRANCH" \
            --name "$BRANCH_NAME"
          
          echo "Branch created and linked successfully."
          echo "Linked branches now:"
          gh issue develop --list --repo "$REPO" "$ISSUE_NUMBER"