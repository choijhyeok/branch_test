name: Create branches from issue

on:
  issues:
    types: [opened]

permissions:
  # issues: write 권한이 필요합니다.
  contents: write
  issues: write # <--- 권한 수정 필요

jobs:
  create_branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # gh issue develop은 브랜치를 생성하기 때문에 git checkout은 반드시 필요하지 않지만,
        # 브랜치 존재 유무 확인(git ls-remote)을 위해서는 Checkout이 있는 것이 좋습니다.
        # 그러나 gh issue develop은 브랜치 생성과 연결을 한번에 처리하므로,
        # 브랜치 존재 유무를 gh 명령어로 확인하는 게 더 효율적입니다.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev # BASE_BRANCH로 체크아웃

      - name: Create branch from issue title and link
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }} # <--- 이슈 번호 추가
          BASE_BRANCH: dev
          GH_TOKEN: ${{ github.token }} # <--- GH_TOKEN 추가
        run: |
          set -euo pipefail # 스크립트 오류 시 즉시 종료

          echo "Issue title: $ISSUE_TITLE"
          echo "Issue number: $ISSUE_NUMBER"

          # 1. 태그 제거 및 슬러그 생성 (기존 로직 유지)
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/^\[[^]]*\][[:space:]]*//')
          CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          SLUG=$(echo "$CLEAN_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[[:punct:]]//g' \
            | tr ' ' '-' \
          )
          SLUG=$(echo "$SLUG" \
            | sed 's/-\+/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
          )
          
          if [ -z "$SLUG" ]; then
            echo "Slug is empty. Aborting."
            exit 1
          fi

          # 2. 브랜치 이름 결정 (기존 로직 유지)
          CREATED="false"
          REPO="${{ github.repository }}"

          # 기존 로직처럼 000-020 중 없는 번호 선택
          for i in $(seq -w 0 20); do
            # 기존에는 ISSUE_NUMBER가 없었지만, gh issue develop을 쓰려면 브랜치 이름에 이슈 번호가 있는 것이 권장됨
            # 기존 auto-branch-on-issue.yml 처럼 issue/NUM-SLUG 패턴을 따르거나, 
            # 아니면 기존처럼 ${i}-${SLUG}-issue 로 가도 무방하나, 연결은 gh가 담당
            BRANCH_NAME="${i}-${SLUG}-issue" 
            
            # gh issue develop을 사용하면 브랜치 존재 유무를 git ls-remote 대신 gh로 확인
            if gh issue develop --list --repo "$REPO" "$ISSUE_NUMBER" | grep -q "$BRANCH_NAME"; then
              echo "Branch $BRANCH_NAME already linked or exists. Skipping index."
              continue
            fi

            # 브랜치 생성 및 이슈 연결 (GH CLI 사용)
            # gh issue develop은 자동으로 브랜치가 없으면 BASE_BRANCH를 기준으로 생성하고 연결까지 해줍니다.
            echo "Creating & linking branch: $BRANCH_NAME"
            gh issue develop "$ISSUE_NUMBER" \
              --repo "$REPO" \
              --branch-repo "$REPO" \
              --base "$BASE_BRANCH" \
              --name "$BRANCH_NAME"
            
            CREATED="true"
            echo "Linked branches now:"
            gh issue develop --list --repo "$REPO" "$ISSUE_NUMBER"
            break
          done

          if [ "$CREATED" != "true" ]; then
            echo "No available index between 000 and 020. No branch created."
            exit 1
          fi