name: Create branches from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create_branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Checkout은 git ls-remote가 동작하는 데 필수는 아니지만, 워크플로우의 안정성을 위해 유지합니다.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Create branch from issue title and link
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: dev
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Issue title: $ISSUE_TITLE"
          echo "Issue number: $ISSUE_NUMBER"

          # 1. 태그 제거 및 슬러그 생성 (로직 동일)
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/^\[[^]]*\][[:space:]]*//')
          CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          SLUG=$(echo "$CLEAN_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[[:punct:]]//g' \
            | tr ' ' '-' \
          )
          SLUG=$(echo "$SLUG" \
            | sed 's/-\+/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
          )
          
          if [ -z "$SLUG" ]; then
            echo "Slug is empty. Aborting."
            exit 1
          fi

          # 2. 브랜치 이름 결정 (번호 증가 로직 수정)
          CREATED="false"
          REPO="${{ github.repository }}"

          # 기존 로직처럼 000-020 중 없는 번호 선택
          for i in $(seq -w 0 20); do
            BRANCH_NAME="${i}-${SLUG}-issue"
            
            # 💡 수정된 부분: 저장소 전체에 브랜치가 존재하는지 확인
            # git ls-remote --heads origin "브랜치명"으로 원격 저장소에 존재하는지 확인합니다.
            if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME" > /dev/null; then
              echo "Branch $BRANCH_NAME already exists in the repository. Skipping index."
              continue # 브랜치가 존재하면 다음 번호(i+1)로 넘어감
            fi

            # 브랜치 생성 및 이슈 연결 (GH CLI 사용)
            # 브랜치가 존재하지 않으므로 gh issue develop 명령어로 생성하고 연결합니다.
            echo "Creating & linking branch: $BRANCH_NAME"
            gh issue develop "$ISSUE_NUMBER" \
              --repo "$REPO" \
              --branch-repo "$REPO" \
              --base "$BASE_BRANCH" \
              --name "$BRANCH_NAME"
            
            CREATED="true"
            echo "Linked branches now:"
            gh issue develop --list --repo "$REPO" "$ISSUE_NUMBER"
            break # 브랜치 생성에 성공했으므로 반복문을 종료

          done

          if [ "$CREATED" != "true" ]; then
            echo "No available index between 000 and 020. No branch created."
            exit 1
          fi