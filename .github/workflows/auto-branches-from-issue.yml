name: Create branches from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  create_branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch from issue title
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_BRANCH: dev   # 현재 default branch
        run: |
          echo "Issue title: $ISSUE_TITLE"

          # 기준 브랜치 체크아웃
          git checkout "$BASE_BRANCH"

          # 앞에 [Feature] 같은 태그 제거
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/^\[[^]]*\][[:space:]]*//')
          echo "Clean title: $CLEAN_TITLE"

          # 앞뒤 공백 정리
          CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          # 슬러그 생성
          # - 영문만 소문자로
          # - 공백 -> -
          # - ASCII 특수문자 몇 개만 제거 (한글/기타 문자는 그대로 둠)
          SLUG=$(echo "$CLEAN_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | tr ' ' '-' \
            | tr -d '[](){}!@#$%^&*+=?|\\/:;'",<.>' \
          )

          # 연속된 - 정리 + 앞뒤 - 제거
          SLUG=$(echo "$SLUG" \
            | sed 's/-\+/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
          )

          echo "Slug: $SLUG"

          if [ -z "$SLUG" ]; then
            echo "Slug is empty. Aborting to avoid creating weird branches."
            exit 1
          fi

          # 000 ~ 020 중 아직 없는 번호 하나만 골라서 브랜치 1개만 생성
          CREATED="false"
          for i in $(seq -w 0 20); do
            BRANCH_NAME="${i}-${SLUG}-issue"

            # 이미 존재하면 다음 번호로
            if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME" > /dev/null; then
              echo "Branch $BRANCH_NAME already exists. Skipping."
              continue
            fi

            echo "Creating branch: $BRANCH_NAME"
            git branch "$BRANCH_NAME" "$BASE_BRANCH"
            git push origin "$BRANCH_NAME"
            CREATED="true"
            break
          done

          if [ "$CREATED" != "true" ]; then
            echo "No available index between 000 and 020. No branch created."
            exit 1
          fi