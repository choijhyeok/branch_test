name: Create branches from issue

on:
  issues:
    types: [opened]   # 이슈 새로 생성될 때만 동작

permissions:
  contents: write     # 브랜치 push 위해 필요
  issues: read

jobs:
  create_branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요 (브랜치 만들 때)

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branches from issue title
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_BRANCH: dev   # 기본 브랜치명 (main / master 등 맞게 수정)
        run: |
          echo "Issue title: $ISSUE_TITLE"

          # 기준 브랜치 체크아웃
          git checkout "$BASE_BRANCH"

          # 이슈 제목을 슬러그 형태로 변환 (소문자, 공백 -> -, 특수문자 제거)
          SLUG=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9가-힣 ]//g' \
            | tr ' ' '-' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//')

          echo "Slug: $SLUG"

          # 000 ~ 020까지 브랜치 생성 및 push
          for i in $(seq -w 0 20); do
            BRANCH_NAME=$(printf "%03d-%s-issue" "$i" "$SLUG")
            echo "Creating branch: $BRANCH_NAME"

            # 이미 존재하면 스킵
            if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME" > /dev/null; then
              echo "Branch $BRANCH_NAME already exists. Skipping."
              continue
            fi

            git branch "$BRANCH_NAME" "$BASE_BRANCH"
            git push origin "$BRANCH_NAME"
          done