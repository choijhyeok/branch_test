name: Create Branch on Issue Opened

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 브랜치 푸시 권한
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set branch name from issue
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # 제목을 slug 형태로 변환 (소문자 + 숫자 + - 만 남기기)
          SAFE_TITLE=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g' \
            | sed -E 's/^-+|-+$//g')

          # 3자리 번호-제목 형식 (예: 101-my-feature)
          BRANCH_NAME=$(printf "%03d-%s" "$ISSUE_NUMBER" "$SAFE_TITLE")

          echo "ISSUE_TITLE: $ISSUE_TITLE"
          echo "SAFE_TITLE: $SAFE_TITLE"
          echo "BRANCH_NAME: $BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create and push branch
        run: |
          DEFAULT_BRANCH=${{ github.event.repository.default_branch }}

          echo "Default branch: $DEFAULT_BRANCH"
          echo "New branch: $BRANCH_NAME"

          git fetch origin "$DEFAULT_BRANCH"
          git checkout -b "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"
          git push origin "$BRANCH_NAME"