name: Create Branch on Issue Opened

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Set branch name from issue
        id: vars
        # 중요: 제목에 따옴표나 특수문자가 있어도 깨지지 않도록 env로 주입합니다.
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Original Title: $ISSUE_TITLE"

          # 1) 소문자로 변환 (한글은 그대로 유지됨)
          LOWER_TITLE=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]')

          # 2) 공백과 슬래시(/)를 하이픈(-)으로 변경
          # 3) [중요] 한글(가-힣), 영문(a-z), 숫자(0-9), 하이픈(-)을 제외한 모든 특수문자 제거
          #    (예: 대괄호[], 특수기호 등은 제거됨)
          SAFE_TITLE=$(echo "$LOWER_TITLE" \
            | sed -E 's/[[:space:]]+/-/g' \
            | sed -E 's,/,--,g' \
            | sed -E 's/[^a-z0-9가-힣-]//g')

          # 4) 연속된 하이픈을 하나로 줄임 (--- -> -) 및 앞뒤 하이픈 제거
          SAFE_TITLE=$(echo "$SAFE_TITLE" | sed -E 's/-+/-/g' | sed -E 's/^-+|-+$//g')

          # 5) 만약 제목이 전부 특수문자라 다 지워졌다면 기본값 설정
          if [ -z "$SAFE_TITLE" ]; then
            SAFE_TITLE="issue"
          fi

          # 최종 브랜치 이름: 000-제목
          BRANCH_NAME=$(printf "%03d-%s" "$ISSUE_NUMBER" "$SAFE_TITLE")

          echo "Final Branch Name: $BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create linked branch via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          
          # Issue 번호와 생성한 브랜치 이름으로 개발 브랜치 생성
          gh issue develop "$ISSUE_NUMBER" \
            --name "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}" \
            --repo "$REPO" \
            --checkout=false