name: Create Branch on Issue Opened

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 브랜치 만들기/푸시
      issues: write     # 이슈에 브랜치 링크

    steps:
      - name: Set branch name from issue
        id: vars
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # 제목을 slug 형태로 변환 (원하시는 규칙대로 수정 가능)
          SAFE_TITLE=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-zA-Z0-9가-힣]+/-/g' \
            | sed -E 's/^-+|-+$//g')

          BRANCH_NAME=$(printf "%03d-%s" "$ISSUE_NUMBER" "$SAFE_TITLE")

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create linked branch via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          REPO=${{ github.repository }}

          echo "Creating branch '$BRANCH_NAME' for issue #$ISSUE_NUMBER in $REPO"

          # 기본 브랜치(main 등) 기준으로 생성하고 Development에 링크
          gh issue develop "$ISSUE_NUMBER" \
            --name "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}" \
            --repo "$REPO"