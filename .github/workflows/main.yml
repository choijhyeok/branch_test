name: Create Branch on Issue Opened

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Set branch name from issue
        id: vars
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # issue title → slug 생성
          # 예: "Test Make" -> "test-make"
          #     "gtm 배포 준비" -> "gtm-배포-준비"
          SAFE_TITLE=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^0-9a-zA-Z가-힣]+/-/g' \
            | sed -E 's/^-+|-+$//g')

          # 3자리 번호 + 제목 slug
          # 예: #7 "TestMake" -> 007-testmake
          BRANCH_NAME=$(printf "%03d-%s" "$ISSUE_NUMBER" "$SAFE_TITLE")

          echo "ISSUE_TITLE: $ISSUE_TITLE"
          echo "SAFE_TITLE: $SAFE_TITLE"
          echo "BRANCH_NAME: $BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create linked branch via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          REPO=${{ github.repository }}

          # 기본 브랜치에서 브랜치 생성 + Development에 링크
          gh issue develop "$ISSUE_NUMBER" \
            --name "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}" \
            --repo "$REPO"