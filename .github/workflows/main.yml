name: Create Branch on Issue Opened

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Set branch name from issue
        id: vars
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # 1) 앞뒤 공백 제거
          ISSUE_TITLE_TRIMMED=$(echo "$ISSUE_TITLE" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')

          # 2) 소문자로 변환 (한글은 그대로)
          LOWER_TITLE=$(echo "$ISSUE_TITLE_TRIMMED" | tr '[:upper:]' '[:lower:]')

          # 3) 공백류 → '-' 로
          #    영문/숫자/한글/하이픈만 남기고 나머지는 '-'로 치환
          SAFE_TITLE=$(echo "$LOWER_TITLE" \
            | sed -E 's/[[:space:]]+/-/g' \
            | sed -E 's/[^0-9a-zA-Z가-힣-]+/-/g' \
            | sed -E 's/^-+|-+$//g')

          # 4) 제목이 전부 특수문자/이모지라서 날아가면 fallback
          if [ -z "$SAFE_TITLE" ]; then
            SAFE_TITLE="issue"
          fi

          # 최종 브랜치 이름: 3자리 번호-제목
          BRANCH_NAME=$(printf "%03d-%s" "$ISSUE_NUMBER" "$SAFE_TITLE")

          echo "ISSUE_TITLE: $ISSUE_TITLE"
          echo "SAFE_TITLE: $SAFE_TITLE"
          echo "BRANCH_NAME: $BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create linked branch via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          REPO=${{ github.repository }}

          # 기본 브랜치에서 브랜치 생성 + Development에 링크
          gh issue develop "$ISSUE_NUMBER" \
            --name "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}" \
            --repo "$REPO"